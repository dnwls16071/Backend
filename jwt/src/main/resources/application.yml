jwt:
  # 키 방식(mac|rsa) × 구현 방식(custom|resource-server) 의 네 조합.
  #   mac-custom          : 대칭키 + 직접 구현한 JwtAuthorizationMacFilter
  #   mac-resource-server : 대칭키 + Spring Security 의 JwtDecoder (기본값)
  #   rsa-custom          : 비대칭키 + 직접 구현한 JwtAuthorizationRsaFilter
  #   rsa-resource-server : 비대칭키 + Spring Security 의 JwtDecoder
  mode: mac-resource-server

  # 아래 두 블록은 서로 값을 공유하지 않는다. 한쪽을 바꿨을 때 다른 쪽이 딸려 움직이면
  # 두 방식을 비교하는 의미가 사라진다.

  mac:
    # 운영에서는 반드시 환경변수로 주입한다. 아래 기본값은 로컬 개발 전용이며
    # 이 파일은 git 에 올라가므로 실제 키를 여기에 적지 않는다.
    secret: ${JWT_MAC_SECRET:local-dev-secret-key-please-change-me-32b}
    algorithm: HS256
    issuer: https://auth.example.com
    # Duration 표기. 10m / 30s / PT10M 모두 인식한다.
    time-to-live: 10m
    clock-skew: 30s
    authorities-claim: authorities

  rsa:
    # 키 쌍은 기동할 때마다 새로 생성된다. 재시작하면 이전 토큰은 무효가 되고,
    # 인스턴스를 여러 개 띄우면 서로의 토큰을 검증하지 못한다.
    key-size: 2048
    algorithm: RS256
    issuer: https://auth.example.com
    time-to-live: 10m
    clock-skew: 30s
    authorities-claim: authorities

logging:
  level:
    org.springframework.security: INFO
